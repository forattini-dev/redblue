name: Next Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-skip:
    name: Check if should skip
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          # Skip if commit is a release (chore: release) or version bump
          if [[ "$COMMIT_MSG" =~ ^chore:\ release ]] || [[ "$COMMIT_MSG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping next release for release commit: $COMMIT_MSG"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  check-build:
    name: Check if builds
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      can_build: ${{ steps.check.outputs.can_build }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-next-${{ hashFiles('**/Cargo.lock') }}

      - name: Check if project builds
        id: check
        run: |
          if cargo build --release 2>&1; then
            echo "can_build=true" >> $GITHUB_OUTPUT
          else
            echo "can_build=false" >> $GITHUB_OUTPUT
            echo "::warning::Build failed, skipping next release"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-build
    if: needs.check-build.outputs.can_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: redblue
            asset_name: rb-linux-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-next-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary_name }} || true

      - name: Prepare binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256 || certutil -hashfile ${{ matrix.asset_name }} SHA256 > ${{ matrix.asset_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  release:
    name: Create Next Release
    needs: [check-build, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          # Get base version from Cargo.toml
          BASE_VERSION=$(grep "^version" Cargo.toml | head -n1 | cut -d '"' -f2)
          VERSION="${BASE_VERSION}-next.${{ github.run_number }}+${{ needs.check-build.outputs.short_sha }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Next version: ${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "rb-*" -o -name "*.sha256" \) -exec cp {} release/ \;
          cp sdk/redblue-sdk.js release/redblue-sdk.js
          shasum -a 256 release/redblue-sdk.js > release/redblue-sdk.js.sha256
          ls -la release/

      - name: Delete old next releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 5
          delete_tag_pattern: ".*-next.*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Next Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: redblue v${{ steps.version.outputs.version }} (next)
          body: |
            # redblue Next Release

            **Version**: `${{ steps.version.outputs.version }}`
            **Commit**: `${{ github.sha }}`
            **Build**: #${{ github.run_number }}

            ## Warning

            This is an automated next release from the latest commit on `main`.
            It may contain unstable features or breaking changes.

            For stable releases, use:
            ```bash
            # Check latest stable
            curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | grep tag_name
            ```

            ## Installation

            ```bash
            # Linux x86_64
            curl -L https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/rb-linux-x86_64 -o rb
            chmod +x rb
            sudo mv rb /usr/local/bin/

            # Verify
            rb --version
            ```

            ## Changes

            See commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          draft: false
          prerelease: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (NPM Registry)
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set SDK package version
        working-directory: sdk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm install --no-package-lock

      - name: Validate SDK package
        working-directory: sdk
        run: |
          npm run build
          npm run coverage
          npm run pack-check

      - name: Publish SDK to NPM (Next)
        working-directory: sdk
        run: npm publish --tag next --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published next package
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Waiting for npm registry to update..."
          PUBLISHED_VERSION=""
          for attempt in 1 2 3 4 5 6; do
            PUBLISHED_VERSION=$(npm view redblue-cli@next version 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$EXPECTED_VERSION" ]; then
              break
            fi
            sleep 10
          done

          if [ "$PUBLISHED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::warning::Expected next dist-tag to be $EXPECTED_VERSION but found '$PUBLISHED_VERSION'"
          else
            echo "Verified next dist-tag: $PUBLISHED_VERSION"
          fi

          npx -y redblue-cli@next --sdk-help >/tmp/redblue-sdk-next-help.txt
          grep -q "redblue-cli wrapper" /tmp/redblue-sdk-next-help.txt

      - name: Job Summary
        run: |
          echo "## 🚀 Next Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | `${{ steps.version.outputs.version }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | `next` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [`${GITHUB_SHA::7}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | `${{ github.ref_name }}` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          echo "# Install latest next" >> $GITHUB_STEP_SUMMARY
          echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash -s -- --channel next" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Install npm wrapper" >> $GITHUB_STEP_SUMMARY
          echo "npm install redblue-cli@next" >> $GITHUB_STEP_SUMMARY
          echo "npx redblue-cli@next --sdk-help" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Page](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [NPM Package](https://www.npmjs.com/package/redblue-cli?activeTab=versions)" >> $GITHUB_STEP_SUMMARY
