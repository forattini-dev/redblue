name: NPM Stable Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (e.g. 0.1.0)'
        required: false

jobs:
  publish:
    name: Publish SDK to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve package version
        id: version
        working-directory: sdk
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Unable to resolve package version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          VERSION="$VERSION" node - <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm install --no-package-lock

      - name: Validate SDK package
        working-directory: sdk
        run: |
          npm run build
          npm run coverage
          npm run pack-check

      - name: Publish package
        working-directory: sdk
        run: npm publish --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Waiting for npm registry to update..."
          PUBLISHED_VERSION=""
          for attempt in 1 2 3 4 5 6; do
            PUBLISHED_VERSION=$(npm view redblue-cli@latest version 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$EXPECTED_VERSION" ]; then
              break
            fi
            sleep 10
          done

          if [ "$PUBLISHED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::warning::Expected latest dist-tag to be $EXPECTED_VERSION but found '$PUBLISHED_VERSION'"
          else
            echo "Verified latest dist-tag: $PUBLISHED_VERSION"
          fi

          npx -y redblue-cli@latest --sdk-help >/tmp/redblue-sdk-help.txt
          grep -q "redblue-cli wrapper" /tmp/redblue-sdk-help.txt

      - name: Job Summary
        run: |
          echo "## 📦 Stable NPM Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`redblue-cli\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install redblue-cli" >> $GITHUB_STEP_SUMMARY
          echo "npx redblue-cli --sdk-help" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
