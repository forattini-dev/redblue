name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - next
      version:
        description: "Optional version (e.g. 0.1.2, next: 0.1.2-next.10)"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.plan.outputs.should_skip }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      package_version: ${{ steps.plan.outputs.package_version }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      github_prerelease: ${{ steps.plan.outputs.github_prerelease }}
      skip_reason: ${{ steps.plan.outputs.skip_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide release target
        id: plan
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          REF="${GITHUB_REF}"
          INPUT_CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          INPUT_VERSION="${{ github.event.inputs.version || '' }}"

          SHOULD_SKIP=false
          RELEASE_CHANNEL=""
          RELEASE_TAG=""
          PACKAGE_VERSION=""
          NPM_TAG=""
          IS_PRERELEASE=false
          SKIP_REASON=""

          normalize_version() {
            local value="$1"
            echo "${value#v}"
          }

          next_version() {
            local base_version="$1"
            local run_number="${{ github.run_number }}"
            echo "${base_version}-next.${run_number}"
          }

          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/v* ]]; then
            RELEASE_CHANNEL="stable"
            RELEASE_TAG="${REF#refs/tags/}"
            PACKAGE_VERSION="$(normalize_version "$RELEASE_TAG")"
            NPM_TAG="latest"
            IS_PRERELEASE=false
          elif [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if [[ "$COMMIT_MSG" =~ ^chore:\ release ]] || [[ "$COMMIT_MSG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              SHOULD_SKIP=true
              SKIP_REASON="Version bump/release commit; skipping next."
            else
              BASE_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
              PACKAGE_VERSION="$(next_version "$BASE_VERSION")"
              RELEASE_CHANNEL="next"
              RELEASE_TAG="v${PACKAGE_VERSION}"
              NPM_TAG="next"
              IS_PRERELEASE=true
              SKIP_REASON="Main branch auto next release"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_CHANNEL" == "stable" ]]; then
              if [[ -z "$INPUT_VERSION" ]]; then
                echo "Stable channel requires version input on workflow_dispatch."
                exit 1
              fi
              RELEASE_CHANNEL="stable"
              PACKAGE_VERSION="$(normalize_version "$INPUT_VERSION")"
              RELEASE_TAG="v${PACKAGE_VERSION}"
              NPM_TAG="latest"
              IS_PRERELEASE=false
            elif [[ "$INPUT_CHANNEL" == "next" ]]; then
              BASE_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
              if [[ -n "$INPUT_VERSION" ]]; then
                PACKAGE_VERSION="$(normalize_version "$INPUT_VERSION")"
              else
                PACKAGE_VERSION="$(next_version "$BASE_VERSION")"
              fi
              RELEASE_CHANNEL="next"
              RELEASE_TAG="v${PACKAGE_VERSION}"
              NPM_TAG="next"
              IS_PRERELEASE=true
            else
              echo "Unsupported channel: $INPUT_CHANNEL"
              exit 1
            fi
          else
            SHOULD_SKIP=true
            SKIP_REASON="Unhandled event/ref for release workflow."
          fi

          echo "should_skip=${SHOULD_SKIP}" >> "${GITHUB_OUTPUT}"
          echo "release_channel=${RELEASE_CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "npm_tag=${NPM_TAG}" >> "${GITHUB_OUTPUT}"
          echo "github_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "skip_reason=${SKIP_REASON}" >> "${GITHUB_OUTPUT}"

  build-embeddings:
    name: Build Embeddings
    needs: [plan]
    if: needs.plan.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-fastembed

      - name: Install dependencies
        run: pip install fastembed

      - name: Build embeddings
        run: python scripts/build-embeddings.py

      - name: Upload embeddings artifact
        uses: actions/upload-artifact@v4
        with:
          name: embeddings
          path: src/mcp/data/embeddings.json

  build:
    name: Build ${{ matrix.target }}
    needs: [plan]
    if: needs.plan.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: redblue
            asset_name: rb-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: redblue
            asset_name: rb-linux-aarch64
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            binary_name: redblue
            asset_name: rb-linux-armv7
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: redblue
            asset_name: rb-linux-aarch64-static
            cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          fi

          if [[ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
            echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
            echo "CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++" >> $GITHUB_ENV
            echo "AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar" >> $GITHUB_ENV
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build release binary (musl container)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          mkdir -p "${HOME}/.cargo/registry" "${HOME}/.cargo/git"

          docker run --rm \
            -v "${PWD}:/volume" \
            -v "${HOME}/.cargo/registry:/root/.cargo/registry" \
            -v "${HOME}/.cargo/git:/root/.cargo/git" \
            -w /volume \
            messense/rust-musl-cross:aarch64-musl \
            bash -lc '
              apt-get update >/dev/null &&
              apt-get install -y golang-go ninja-build >/dev/null &&
              export BORING_BSSL_SYSROOT="${TARGET_HOME}" &&
              cargo build --locked --release --target aarch64-unknown-linux-musl
            '

          sudo chown -R "$(id -u):$(id -g)" target/aarch64-unknown-linux-musl

      - name: Strip binary (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Strip binary (Cross Linux)
        if: matrix.cross
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.binary_name }} || true
          elif [[ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]]; then
            arm-linux-gnueabihf-strip target/${{ matrix.target }}/release/${{ matrix.binary_name }} || true
          fi

      - name: Prepare binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256 || certutil -hashfile ${{ matrix.asset_name }} SHA256 > ${{ matrix.asset_name }}.sha256

      - name: Verify self
        if: "!matrix.cross"
        shell: bash
        run: |
          HASH=$(cat ${{ matrix.asset_name }}.sha256 | awk '{print $1}')
          ./${{ matrix.asset_name }} crypto hash verify ${{ matrix.asset_name }} $HASH

      - name: Evasion build info
        if: "!matrix.cross"
        shell: bash
        run: ./${{ matrix.asset_name }} evasion build info

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  prepare-release:
    name: Prepare release artifacts
    needs: [plan, build, build-embeddings]
    if: needs.plan.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect payload
        run: |
          mkdir -p release
          find artifacts -type f \( -name "rb-*" -o -name "*.sha256" \) -exec cp {} release/ \;
          cp sdk/redblue-sdk.js release/redblue-sdk.js
          shasum -a 256 release/redblue-sdk.js > release/redblue-sdk.js.sha256

          cd release
          echo "### SHA256 Checksums" > CHECKSUMS.txt
          for f in *.sha256; do
            cat "$f" >> CHECKSUMS.txt
          done
          cd ..

          if [ -f artifacts/embeddings/embeddings.json ]; then
            cp artifacts/embeddings/embeddings.json release/
          fi

          ls -la release/

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error

  publish-github:
    name: Publish GitHub release
    needs: [plan, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: needs.plan.outputs.should_skip != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
          merge-multiple: true

      - name: Render release body
        id: changelog
        run: |
          VERSION_NUMBER="${{ needs.plan.outputs.package_version }}"
          CHANNEL="${{ needs.plan.outputs.release_channel }}"

          if [[ "$CHANNEL" == "next" ]]; then
            echo "changes<<EOF" >> "$GITHUB_OUTPUT"
            echo "# redblue Next Release" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "**Version**: \`${{ needs.plan.outputs.release_tag }}\`" >> "$GITHUB_OUTPUT"
            echo "**Channel**: \`next\`" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "Generated from commit: \`${GITHUB_SHA}\`" >> "$GITHUB_OUTPUT"
            echo "Build: \`#${{ github.run_number }}\`" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "## Warning" >> "$GITHUB_OUTPUT"
            echo "This is an automated pre-release and may contain unstable changes." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGELOG_CHUNK=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_CHUNK=$(awk '/^## \['"${VERSION_NUMBER}"'\]/,/^## \[/{if(/^## \['"${VERSION_NUMBER}"'\]/){next}if(/^## \[/){exit}print}' CHANGELOG.md)
          fi

          if [ -z "$CHANGELOG_CHUNK" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG_CHUNK=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
            else
              CHANGELOG_CHUNK=$(git log --pretty=format:"- %s" --no-merges -10)
            fi
          fi

          if [ -z "$CHANGELOG_CHUNK" ]; then
            CHANGELOG_CHUNK="No changes detected."
          fi

          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "## Changes" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG_CHUNK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Delete old next releases
        if: needs.plan.outputs.release_channel == 'next'
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 5
          delete_tag_pattern: ".*-next.*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          name: redblue ${{ needs.plan.outputs.release_tag }}
          body: |
            # redblue ${{ needs.plan.outputs.release_tag }}

            ${{ steps.changelog.outputs.changes }}

            ## Installation
            Download the binary for your platform and make it executable:

            ```bash
            # Linux x86_64
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.plan.outputs.release_tag }}/rb-linux-x86_64 -o rb
            chmod +x rb
            sudo mv rb /usr/local/bin/
            ```

            ## Verify installation

            ```bash
            rb --version
            rb help
            ```
          prerelease: ${{ needs.plan.outputs.github_prerelease }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        run: |
          echo "## Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Channel** | \`${{ needs.plan.outputs.release_channel }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ needs.plan.outputs.release_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **NPM Tag** | \`${{ needs.plan.outputs.npm_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish npm package
    needs: [plan, prepare-release, publish-github]
    runs-on: ubuntu-latest
    if: needs.plan.outputs.should_skip != 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package version
        run: |
          VERSION="${{ needs.plan.outputs.package_version }}"
          VERSION="$VERSION" node - <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Validate package
        run: |
          npm install --no-package-lock
          npm run build
          npm run coverage
          npm run pack-check

      - name: Publish package
        run: npm publish --tag "${{ needs.plan.outputs.npm_tag }}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.package_version }}
          NPM_TAG: ${{ needs.plan.outputs.npm_tag }}
        run: |
          EXPECTED_VERSION_CANONICAL="${EXPECTED_VERSION%%+*}"

          echo "Waiting for npm registry to update..."
          PUBLISHED_VERSION=""
          for attempt in 1 2 3 4 5 6; do
            PUBLISHED_VERSION=$(npm view redblue-cli@${NPM_TAG} version 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$EXPECTED_VERSION_CANONICAL" ]; then
              break
            fi
            sleep 10
          done

          if [ "$PUBLISHED_VERSION" != "$EXPECTED_VERSION_CANONICAL" ]; then
            echo "::warning::Expected npm ${NPM_TAG} tag to be $EXPECTED_VERSION_CANONICAL but found '$PUBLISHED_VERSION'"
          else
            echo "Verified npm ${NPM_TAG} tag: $PUBLISHED_VERSION"
          fi

          REDBLUE_SKIP_POSTINSTALL=1 npx -y redblue-cli@${NPM_TAG} --sdk-help >/tmp/redblue-sdk-help.txt
          grep -q "redblue-cli wrapper" /tmp/redblue-sdk-help.txt

      - name: Job summary
        run: |
          echo "## NPM published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Package** | \`redblue-cli\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ needs.plan.outputs.package_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ needs.plan.outputs.npm_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
