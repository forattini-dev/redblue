# Speed-up knobs. CI runners without mold simply ignore this via cfg gating.
# Override locally by setting CARGO_TARGET_<TARGET>_LINKER or RUSTFLAGS.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Cross-compile targets (aarch64, armv7, musl) keep their default linker
# because CI overrides CARGO_TARGET_*_LINKER with the matching cross gcc.
# Native arm64 hosts can opt in via ~/.cargo/config.toml.

[build]
# Use all cores for codegen units dispatch.
# jobs = <leave unset — cargo picks nproc>
