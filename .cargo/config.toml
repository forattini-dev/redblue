# Speed-up knobs. CI runners without mold simply ignore this via cfg gating.
# Override locally by setting CARGO_TARGET_<TARGET>_LINKER or RUSTFLAGS.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[build]
# Use all cores for codegen units dispatch.
# jobs = <leave unset — cargo picks nproc>
